[project]
name = "video-summarizer"
version = "0.4.1-quality-evaluation"
description = "B站/本地视频总结器 - 自动提取音频/字幕，转成文字并生成摘要"
authors = [{name = "Developer"}]
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "python-dotenv>=1.0.0",
    "pydantic-settings>=2.0.0",
    "faster-whisper>=1.0.0",
    "yt-dlp>=2024.0.0",
    "openai>=1.12.0",
    "ollama>=0.1.0",
    "srt>=3.5.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
video-summarizer = "video_summarizer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["video_summarizer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[project.metadata]
tags = [
    "video-summarizer",
    "bilibili",
    "whisper",
    "llm",
]

[project.metadata.urls]
Repository = "https://github.com/example/video-summarizer"
